# JukaMix OS - TrimUI Smart Pro S (TG5050) RetroArch Optimization Profile
# Optimized for Allwinner A523 SoC with Mali-G57 GPU

# Core recommendations for best performance on A523
snes9x = snes9x2015
megadrive = picodrive
gba = mgba
nds = drastic
n64 = parallel_n64
psp = ppsspp_1.17.1_gl

# Display settings for 1280x720 horizontal panel
video_fullscreen_x = 1280
video_fullscreen_y = 720
aspect_ratio_index = 22  # 16:9 landscape

# GPU optimizations for Mali-G57
video_driver = gl
gl_driver = egl
video_scale_integer = false
