# Game: Sonic Adventure (Dreamcast)
# System: DC
# Device: tg5050
# Contributor: @JukaMix-Team
# Date: 2026-08-17
# Tested Firmware: v1.5.0
# Status: VERIFIED

[performance]
cpu_governor = performance
cpu_min_freq = 1416000
cpu_max_freq = 2200000
active_cores = 4
preferred_core = flycast

[gpu]
internal_resolution = 2x
texture_upscaling = enabled
anisotropic_filtering = 4
threaded_rendering = true
frame_skip = 0
vsync = false

[audio]
latency_ms = 32
sync_enabled = false
volume_boost = 100

[controls]
analog_deadzone = 10%
trigger_deadzone = 5%
hotkey_button = Y

[saves]
autosave_interval = 300
compression = zlib
compression_level = 3
max_slots = 10

[overlay]
preset = none
opacity = 70
aspect_ratio = original

[notes]
"Runs at full speed with 2x upscale on TG5050. Disable fog in Flycast settings for +5 FPS. Audio sync not required due to A523 performance headroom."
