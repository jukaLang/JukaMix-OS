# JukaMix OS - Game Profile Template

# =============================================================================
# GAME PROFILE TEMPLATE FOR JUKAMIX OS
# Copy this file and fill in the sections below for your game optimization
# =============================================================================

# -----------------------------------------------------------------------------
# HEADER (Required)
# -----------------------------------------------------------------------------
# Game: <Full game name>
# System: <SYSTEM_CODE e.g., N64, PSP, DC, PS1>
# Device: <tg5050 | tsp | brick | all>
# Contributor: <Your GitHub/Discord handle>
# Date: <YYYY-MM-DD when tested>
# Tested Firmware: <JukaMix OS version>
# Status: <TESTING | VERIFIED | DEPRECATED>

# -----------------------------------------------------------------------------
# PERFORMANCE SETTINGS
# -----------------------------------------------------------------------------
[performance]
# CPU governor: performance | ondemand | conservative | powersave
cpu_governor = ondemand

# Frequency range in kHz (check device limits in DEVICE-OVERRIDES/<device>_base.cfg)
cpu_min_freq = 816000
cpu_max_freq = 2000000

# Active CPU cores (1-4 for most devices)
active_cores = 4

# Emulator core preference (optional, overrides system default)
# Examples: snes9x2015, mgba, parallel_n64, ppsspp_1.17.1_gl
preferred_core = 

# -----------------------------------------------------------------------------
# GPU SETTINGS
# -----------------------------------------------------------------------------
[gpu]
# Internal resolution multiplier: 1x | 2x | 3x | 4x (device-dependent)
internal_resolution = 1x

# Texture upscaling: enabled | disabled
texture_upscaling = disabled

# Anisotropic filtering: 0 | 2 | 4 | 8 | 16
anisotropic_filtering = 0

# Threaded rendering: true | false
threaded_rendering = true

# Frame skipping: 0 (disabled) | 1 | 2 | auto
frame_skip = 0

# VSync: true | false
vsync = false

# Shader preset (optional, path relative to RetroArch/shaders/)
shader_preset = 

# -----------------------------------------------------------------------------
# AUDIO SETTINGS
# -----------------------------------------------------------------------------
[audio]
# Audio latency in milliseconds (lower = less delay, higher = more stable)
latency_ms = 32

# Audio sync: true | false
sync_enabled = false

# Volume boost: 0-200 (100 = normal)
volume_boost = 100

# -----------------------------------------------------------------------------
# CONTROL SETTINGS
# -----------------------------------------------------------------------------
[controls]
# Analog stick deadzone: 0-30%
analog_deadzone = 15%

# Trigger deadzone: 0-20%
trigger_deadzone = 5%

# Hotkey enable button (for save states, fast forward, etc.)
hotkey_button = Y

# Custom button mapping (optional, override default layout)
# Format: button_name = button_number or axis(axis_number+/-)
# Example: input_a_btn = 0
#          input_b_btn = 1

# -----------------------------------------------------------------------------
# SAVE STATE SETTINGS
# -----------------------------------------------------------------------------
[saves]
# Autosave interval in seconds (0 = disabled)
autosave_interval = 300

# Save state compression: none | zlib | zstd
compression = zlib

# Compression level: 1-9 (higher = smaller files, slower saves)
compression_level = 3

# Max save slots to keep (older ones auto-deleted)
max_slots = 10

# -----------------------------------------------------------------------------
# VIDEO OVERLAY (Optional)
# -----------------------------------------------------------------------------
[overlay]
# Overlay preset: none | scanlines | crt | custom
preset = none

# Opacity: 0-100%
opacity = 70

# Aspect ratio: 4:3 | 16:9 | stretch | original
aspect_ratio = original

# -----------------------------------------------------------------------------
# NOTES & TIPS (Optional but encouraged)
# -----------------------------------------------------------------------------
[notes]
# Add any performance notes, known issues, or tips here
# Examples:
# "Runs at full speed with 2x upscale on tg5050"
# "Disable fog for +5 FPS"
# "Audio crackling on TSP, use conservative governor"
# "Requires BIOS file: scph5501.bin"

# =============================================================================
# END OF TEMPLATE
# Remove this section and all comments before submitting your profile
# =============================================================================
