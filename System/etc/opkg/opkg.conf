# JukaMix OS package feed (opkg-compatible).
#
# This file is read by the real `opkg` binary when one is present AND by the
# built-in client (jm-opkg / tools/lib/jukamix-opkg.sh), which parses the
# first src/gz line to discover the feed URL.
#
# Packages install to the SD card so the read-only internal firmware is never
# modified. User data (Roms/BIOS/Saves/...) lives outside the package root.

dest root /
dest sd /mnt/SDCARD

# The release workflow builds the feed from packages/ and uploads it to every
# release; releases/latest/download always resolves to the newest one, so this
# URL needs no per-build stamping. The feed contains Packages(.gz) plus the
# *.ipk files produced by tools/jukamix-mkfeed.sh.
src/gz jukamix https://github.com/jukaLang/JukaMix-OS/releases/latest/download

arch all 1
arch aarch64 10
arch armv7 20

option check_signature 0
