#desc=Nintendo layout (A/B and X/Y swapped)
# Swaps A↔B and X/Y to match Nintendo controller layout
# Physical A -> DS B (confirm)
# Physical B -> DS A (back)
# Physical X -> DS Y
# Physical Y -> DS X
A=B
B=A
X=Y
Y=X
L1=L1
R1=R1
L2=L2
R2=R2
START=START
SELECT=SELECT
UP=UP
DOWN=DOWN
LEFT=LEFT
RIGHT=RIGHT
