name: JukaMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release stamp (defaults to a date-time stamp like 0820202614 = Aug 20, 2026, 14:00)"
        required: false
      skip_firmware:
        description: "Skip fetching TrimUI firmware blobs (no download URLs configured yet; uncheck to run the fetch)"
        type: boolean
        default: true

jobs:
  # ── Main release build (rootfs downloaded from pre-built release) ─────────
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Phase 1: independent downloads / tools (no repo needed) ──────────
      - name: Get version
        # Release builds are named JukaMix_<stamp>, where the stamp is the build
        # date+hour (MMDDYYYYHH, e.g. 0820202614 = Aug 20, 2026, 14:00). The
        # version input overrides the stamp for manual runs.
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BUILD_VERSION="${{ github.event.inputs.version }}"
          else
            BUILD_VERSION=$(date +%m%d%Y%H)
          fi
          [ -n "$BUILD_VERSION" ] || { echo "version is empty" >&2; exit 1; }
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
      - name: Install 7-Zip
        # p7zip-full ships 7zr, which handles both 7z extraction and creation
        # (what the cores + default_config steps need). Using Ubuntu's apt
        # archive instead of www.7-zip.org avoids the version-churn 404s:
        # 7-Zip retires previous tarballs each major release (7z2406-* vanished
        # mid-2026), which broke the build.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          which 7zr

      # ── Phase 2: clone + repo-dependent work ─────────────────────────────
      # Shallow clone (default) — the tree is ~3.7 GB, so history would make
      # the download worse. fetch-depth: 1 is explicit so nobody "fixes" it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download pre-built rootfs images
        run: |
          mkdir -p /home/runner/work/JukaMix-OS/output
          echo "Downloading TG5050 rootfs..."
          wget -q --show-progress \
            "https://github.com/jukaLang/JukaMix-OS/releases/download/BuildRootFS/rootfs-tg5050.ext2" \
            -O /home/runner/work/JukaMix-OS/output/rootfs-tg5050.ext2
          echo "Downloading TSP/Brick rootfs..."
          wget -q --show-progress \
            "https://github.com/jukaLang/JukaMix-OS/releases/download/BuildRootFS/rootfs-tsp-brick.ext2" \
            -O /home/runner/work/JukaMix-OS/output/rootfs-tsp-brick.ext2
          echo "Verifying downloads..."
          ls -lh /home/runner/work/JukaMix-OS/output/rootfs-*.ext2
          echo "rootfs download complete"
      - name: Fetch firmware blobs
        # Skip by default: trimui/firmwares/firmware_sources.txt has no download
        # URLs configured yet, so the fetch cannot succeed on an ephemeral runner.
        # Flip the skip_firmware input when the canonical TrimUI firmware URL is
        # configured. Pushes always skip; only an explicit dispatch can opt in.
        env:
          JUKAMIX_SKIP_FIRMWARE: ${{ (github.event_name == 'push' || inputs.skip_firmware == 'true') && '1' || '' }}
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          bash scripts/fetch_firmware.sh
      - name: Fetch RetroArch cores archive
        # cores.7z (~335MB) is too large for git; hosted at
        # https://github.com/jukaLang/Packages/releases/download/cores/cores.7z
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          bash scripts/fetch_cores.sh
      - name: Extract RetroArch cores
        # Extract all 165 cores (~1.8GB uncompressed). The archive is deleted
        # after extraction so it doesn't ship in the release zip.
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS/RetroArch/.retroarch/cores
          7zr x cores.7z
          rm cores.7z
      - name: Cleaning image...
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          find . -type f -name ".gitkeep" -delete
          rm -rf _assets .git .github
          rm -f LICENSE README.md
          7zr a RetroArch/default_config.7z RetroArch/retroarch.cfg RetroArch/.retroarch/config/*
      - name: Stamp OS version
        # Must run before the OTA manifest and device gate: both hash/verify
        # the version file, so it has to match what the archive ships.
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          printf '%s\n' "${{ env.BUILD_VERSION }}" > System/usr/trimui/jukamix-version.txt
      - name: Stamp JukaHub patch index
        # Match build_release.sh: the shipped packages.json must reference the
        # release that contains it, otherwise JukaHub's Patch view 404s.
        # Shared logic lives in scripts/stamp_jukahub.py.
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          python3 scripts/stamp_jukahub.py Apps/JukaHub/patch/packages.json "${{ env.BUILD_VERSION }}"
      - name: Restore executable bits
        # Git clones made on Windows do not record the executable bit; restore
        # it for every shebang script and ELF binary so the archive boots.
        # The inner sh must exit 0: GNU find propagates a non-zero -exec status
        # (the last [ ] test fails for any non-shebang file), which would fail
        # this step under -e.
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          find . -type f -exec sh -c '
            for f do
              [ "$(head -c 2 "$f" 2>/dev/null)" = "#!" ] && { chmod +x "$f"; continue; }
              [ "$(head -c 4 "$f" 2>/dev/null)" = "$(printf "\177ELF")" ] && chmod +x "$f"
            done
            exit 0
          ' sh {} +
      - name: Generate OTA manifest
        # Generated after the exec-bit restore so the executable flags match
        # what the archive ships. make-ota-manifest.sh skips the same paths the
        # zip step excludes below (host scaffolding + protected user data).
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          bash tools/make-ota-manifest.sh . /home/runner/work/JukaMix-OS/manifest.txt
      - name: Build JukaMix packages (opkg feed)
        # Build every package in packages/ into an opkg feed (.ipk + Packages
        # index). The feed is uploaded with the release; the on-device opkg.conf
        # points at releases/latest/download, so jm-opkg always sees the newest
        # feed without any version stamping.
        run: |
          set -e
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          mkdir -p /home/runner/work/JukaMix-OS/feed
          for pkg in packages/*/; do
            [ -f "$pkg/control" ] || continue
            sh tools/jukamix-mkpackage.sh "$pkg" /home/runner/work/JukaMix-OS/feed
          done
          sh tools/jukamix-mkfeed.sh /home/runner/work/JukaMix-OS/feed
          ls -la /home/runner/work/JukaMix-OS/feed
      - name: Validate devices (tsp + tg5050 + brick)
        run: |
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          bash scripts/validate_devices.sh . \
            --devices "tsp tg5050 brick" \
            --version "${{ env.BUILD_VERSION }}" \
            --manifest /home/runner/work/JukaMix-OS/manifest.txt

      # ── Phase 3: package (right at the end) ──────────────────────────────
      - name: Zipping release
        run: |
          shopt -s dotglob
          cd /home/runner/work/JukaMix-OS/JukaMix-OS
          # Excludes mirror scripts/build_release.sh's stage (kept in sync):
          # host-side scaffolding plus protected user-data dirs that the updater
          # promises to never touch.
          zip -r "/home/runner/work/JukaMix-OS/JukaMix_${{ env.BUILD_VERSION }}.zip" ./* \
            -x "./scripts/*" -x "./tests/*" -x "./schemas/*" -x "./packages/*" \
            -x "*.zip" -x "*.log" -x "./MANIFEST.json" -x "./jukauser.json" \
            -x "./.VolumeIcon.icns" -x "./autorun.inf" \
            -x "./.gitignore" -x "./.gitattributes"
      - name: Split release zip (GitHub 2GB limit)
        run: |
          cd /home/runner/work/JukaMix-OS
          ZIP_FILE="JukaMix_${{ env.BUILD_VERSION }}.zip"
          ZIP_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE")
          echo "ZIP size: $ZIP_SIZE bytes ($(echo "scale=2; $ZIP_SIZE / 1073741824" | bc)GB)"
          
          if [ "$ZIP_SIZE" -gt 2147483648 ]; then
            echo "ZIP exceeds 2GB, splitting into parts..."
            # Split into 1GB parts
            split -b 1073741824 -d -a 2 "$ZIP_FILE" "${ZIP_FILE%.zip}.part."
            ls -lh ${ZIP_FILE%.zip}.part.*
            echo "PARTS_CREATED=true" >> $GITHUB_ENV
          else
            echo "ZIP is under 2GB, no split needed"
            echo "PARTS_CREATED=false" >> $GITHUB_ENV
          fi
      - name: Create Release
        run: |
          cd /home/runner/work/JukaMix-OS
          
          # Delete existing release/tag if present
          gh release delete "JukaMix_${{ env.BUILD_VERSION }}" --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
          
          # Create new release
          gh release create "JukaMix_${{ env.BUILD_VERSION }}" \
            --repo ${{ github.repository }} \
            --title "JukaMix ${{ env.BUILD_VERSION }}" \
            --notes "JukaMix OS ${{ env.BUILD_VERSION }}"
          
          echo "Release created: JukaMix_${{ env.BUILD_VERSION }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        run: |
          cd /home/runner/work/JukaMix-OS
          
          # Upload main zip
          echo "Uploading main release zip..."
          gh release upload "JukaMix_${{ env.BUILD_VERSION }}" \
            "JukaMix_${{ env.BUILD_VERSION }}.zip" \
            --repo ${{ github.repository }} --clobber
          
          # Upload manifest
          echo "Uploading manifest..."
          gh release upload "JukaMix_${{ env.BUILD_VERSION }}" \
            "manifest.txt" \
            --repo ${{ github.repository }} --clobber
          
          # Upload feed files
          echo "Uploading feed files..."
          for feed_file in feed/*; do
            [ -f "$feed_file" ] || continue
            gh release upload "JukaMix_${{ env.BUILD_VERSION }}" \
              "$feed_file" \
              --repo ${{ github.repository }} --clobber
          done
          
          # Upload rootfs files
          echo "Uploading rootfs files..."
          gh release upload "JukaMix_${{ env.BUILD_VERSION }}" \
            "output/rootfs-tg5050.ext2" \
            "output/rootfs-tsp-brick.ext2" \
            --repo ${{ github.repository }} --clobber
          
          # Upload split parts if they exist
          if [ "${{ env.PARTS_CREATED }}" = "true" ]; then
            echo "Uploading split parts..."
            for part in JukaMix_${{ env.BUILD_VERSION }}.part.*; do
              [ -f "$part" ] || continue
              echo "Uploading $part..."
              gh release upload "JukaMix_${{ env.BUILD_VERSION }}" \
                "$part" \
                --repo ${{ github.repository }} --clobber
            done
          fi
          
          echo "All assets uploaded successfully"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
